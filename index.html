<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#031428">
<title>AOM 2026 | Painel da equipe</title>
<link rel="stylesheet" href="assets/style.css?v=21">
</head>
<body class="locked">
<div id="lock" class="lock">
  <img class="mandala-bg" src="assets/img/mandala.png" alt="" aria-hidden="true">
  <form id="lock-form" class="lock-box" autocomplete="off">
    <img class="logo-aom" src="assets/img/aom-logo.png" alt="AOM 2026 - Annual Operations Meeting">
    <p>Painel da equipe. Digite o código de acesso.</p>
    <input type="password" id="lock-code" placeholder="Código de acesso" autocomplete="off" required aria-label="Código de acesso">
    <button type="submit">Entrar</button>
    <p class="lock-msg" id="lock-msg" role="alert"></p>
    <img class="logo-tr" src="assets/img/tr-logo.png" alt="Thomson Reuters">
  </form>
</div>

<div id="app">
  <header class="top">
    <img class="mandala" src="assets/img/mandala.png" alt="" aria-hidden="true">
    <div class="top-row">
      <h1 class="sr">AOM 2026</h1>
      <img class="logo-aom" src="assets/img/aom-logo.png" alt="AOM 2026">
      <div class="top-right">
        <button id="conn" class="conn" type="button" hidden></button>
        <div class="countdown" id="countdown" aria-live="polite"></div>
        <button id="who" class="who" type="button" aria-label="Quem é você?"></button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>

  <button id="fab" class="fab" type="button" aria-label="Nova tarefa" hidden>+</button>
  <footer><span id="rodape"></span></footer>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="data/aom.enc.js?v=21"></script>
<script src="assets/aviso-img.js?v=21"></script>
<script src="assets/app.js?v=21"></script>
<script src="assets/unlock.js?v=21"></script>
</body>
</html>
